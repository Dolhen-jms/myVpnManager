[package]
name = "myvpnmanager"
version = "0.1.0"
edition = "2024"
description = "Client openconnect en terminal, à la nmtui, avec module pour la barre wayle"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
libc = "0.2.191"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
zeroize = "1"

[profile.release]
strip = true
lto = true
